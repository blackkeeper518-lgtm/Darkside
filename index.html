<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Command | PARCEL DROP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-black text-stone-200 font-sans min-h-screen">
    <main class="max-w-4xl mx-auto p-6 md:p-12 space-y-8 text-center">
        <h2 class="text-4xl font-black italic uppercase text-white">THE <span class="text-red-600">PARCEL</span> DROP</h2>
        <p class="text-sm text-stone-400">รับไฟล์ Flash ภาษาอังกฤษและไฟล์ขนส่งภาษาไทย → แปลงลง <b class="text-amber-400">public.parcels</b></p>
        <div id="drop-zone" class="p-12 md:p-20 border-4 border-dashed border-red-900/40 rounded-3xl bg-red-950/10 cursor-pointer hover:border-red-600 transition-all">
            <span class="text-7xl block mb-4">📂</span>
            <h3 class="text-2xl font-black uppercase text-white">Drop Excel / CSV Payload</h3>
            <p class="text-xs text-stone-500 mt-2">รองรับ .xlsx / .xls / .csv · อังกฤษหรือภาษาไทย</p>
            <input type="file" id="file-input" class="hidden" accept=".csv,.xlsx,.xls">
        </div>
        <div id="status-panel" class="hidden p-6 bg-stone-900 rounded-2xl border border-red-900/30 text-left">
            <div id="spinner" class="w-10 h-10 border-4 border-red-950 border-t-red-600 rounded-full animate-spin mx-auto mb-4"></div>
            <p id="status-text" class="text-xl font-black uppercase italic text-amber-500 text-center"></p>
            <div id="result-box" class="hidden mt-5 grid gap-2 sm:grid-cols-2 text-sm"></div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = "https://ichgztcnxxjkmwxgnslp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_R20WCz34yvITmGhn8m8JOQ_rUURgLDw";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusPanel = document.getElementById('status-panel');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const resultBox = document.getElementById('result-box');
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-red-600'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-red-600');
        dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('border-red-600'); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        const cleanHeader = (value) => String(value ?? '').trim().toLowerCase().replace(/[\s_\-().（）:：/\\]+/g, '');
        const valueFrom = (row, names) => {
            const wanted = names.map(cleanHeader);
            const key = Object.keys(row).find(k => wanted.includes(cleanHeader(k)));
            return key == null ? '' : row[key];
        };
        const text = (value) => String(value ?? '').trim();
        const phone = (value) => {
            const digits = text(value).replace(/\D/g, '');
            return digits.startsWith('66') && digits.length === 11 ? '0' + digits.slice(2) : digits;
        };
        const pickupDate = (value) => value instanceof Date && !Number.isNaN(value.getTime()) ? value.toISOString() : text(value);
        function mapParcel(row) {
            return {
                pickup_date: pickupDate(valueFrom(row, ['Pickup Date', 'pickup_date', 'วันที่รับพัสดุ', 'วันที่รับ', 'วันที่ส่ง', 'วันที่'])),
                tracking_number: text(valueFrom(row, ['Tracking number', 'Tracking Number', 'tracking_number', 'เลขพัสดุ', 'เลขที่พัสดุ', 'เลขแทรค', 'เลข Tracking'])),
                consignee: text(valueFrom(row, ['Consignee', 'consignee', 'ชื่อผู้รับ', 'ชื่อผู้รับพัสดุ', 'ชื่อลูกค้า', 'ผู้รับ'])),
                phone_number: phone(valueFrom(row, ['Phone number', 'Phone Number', 'phone_number', 'phone', 'เบอร์โทร', 'เบอร์โทรศัพท์', 'เบอร์ผู้รับ', 'โทรศัพท์'])),
                address: text(valueFrom(row, ['Address', 'address', 'ที่อยู่', 'ที่อยู่จัดส่ง', 'ที่อยู่ผู้รับ', 'ที่อยู่ที่รับ'])),
                cod_amount: text(valueFrom(row, ['COD Amount(THB)', 'COD Amount (THB)', 'COD Amount', 'cod_amount', 'ยอด COD', 'ยอดCOD', 'ยอดเก็บปลายทาง', 'COD'])) || '0'
            };
        }
        const validParcel = (row) => row.tracking_number && row.consignee && row.phone_number && row.address;
        function showResult(fileName, rows, skipped) {
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = [['ไฟล์', fileName], ['ปลายทาง', 'public.parcels'], ['บันทึกสำเร็จ', `${rows} รายการ`], ['ข้าม/ข้อมูลไม่ครบ', `${skipped} รายการ`]]
                .map(([label, value]) => `<div class="rounded-lg bg-black/40 p-3"><span class="text-stone-500">${label}</span><br><b class="text-emerald-400 break-all">${value}</b></div>`).join('');
        }
        async function handleFile(file) {
            if (!file) return;
            statusPanel.classList.remove('hidden'); resultBox.classList.add('hidden'); spinner.classList.remove('hidden');
            statusText.className = 'text-xl font-black uppercase italic text-amber-500 text-center';
            statusText.innerText = `กำลังอ่าน ${file.name}...`;
            try {
                const workbook = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                if (!rawRows.length) throw new Error('ไฟล์ว่างหรืออ่านแถวข้อมูลไม่ได้');
                const mapped = rawRows.map(mapParcel);
                const payload = mapped.filter(validParcel);
                const skipped = mapped.length - payload.length;
                if (!payload.length) throw new Error('ไม่พบแถวที่มีเลขพัสดุ ชื่อ เบอร์โทร และที่อยู่ครบ');
                for (let i = 0; i < payload.length; i += 50) {
                    const chunk = payload.slice(i, i + 50);
                    statusText.innerText = `กำลังบันทึกลง PARCELS ${Math.min(i + chunk.length, payload.length)} / ${payload.length}...`;
                    const { error } = await sb.from('parcels').insert(chunk);
                    if (error) throw error;
                }
                spinner.classList.add('hidden');
                statusText.className = 'text-xl font-black italic text-emerald-400 text-center';
                statusText.innerText = '✅ นำเข้า public.parcels สำเร็จ';
                showResult(file.name, payload.length, skipped);
            } catch (err) {
                console.error('IMPORT ERROR:', err); spinner.classList.add('hidden');
                statusText.className = 'text-xl font-black italic text-red-500 text-center';
                statusText.innerText = '❌ นำเข้าไม่สำเร็จ: ' + (err?.message || 'FAILED');
            } finally { fileInput.value = ''; }
        }
    </script>
</body>
</html>
